name: Install Kai
description: Put the released kai, which runs the repository's Kaifile.roc, on PATH. Needs Nix.

runs:
  using: composite
  steps:
    - name: Install Kai
      shell: bash
      env:
        KAI_VERSION: 0.0.11
        KAI_X86_64_LINUX_SHA256: ffd3d8e5326ab54fa8d2bcedc2bfc97f8734f539004e089e9d617f61a9a0b3f6
        KAI_AARCH64_LINUX_SHA256: 1d69937fa6e0a969be25130776f11ff08e6d323d90c1a70e82715f4a7ffe9bdd
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/kai"
        mkdir -p "$dir"
        case "$RUNNER_ARCH" in
          X64) system=x86_64-linux sha256="$KAI_X86_64_LINUX_SHA256" ;;
          ARM64) system=aarch64-linux sha256="$KAI_AARCH64_LINUX_SHA256" ;;
          *)
            echo "no kai for $RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        archive="kai-$KAI_VERSION-$system.tar.gz"
        curl -fsSL -o "$dir/$archive" \
          "https://github.com/thebrandonlucas/kai/releases/download/v$KAI_VERSION/$archive"
        echo "$sha256  $dir/$archive" | sha256sum -c -
        tar -xzf "$dir/$archive" -C "$dir" kai
        "$dir/kai" --version
        echo "$dir" >> "$GITHUB_PATH"
