name: Set up Kai
description: >-
  Install a Kai release with this repository's install.sh, which checks it
  against the release's SHA256SUMS, and put kai on PATH, on a Linux or, from
  0.0.12 on, an Apple Silicon macOS runner. Optionally install Nix first, and
  cache Kai's downloads between runs.

inputs:
  version:
    description: >-
      The Kai release to install, such as 0.0.12. By default, the release
      whose platform Kaifile.roc's header names (`pf:`), so that a run
      installs the kai the Kaifile was written for.
    default: ""
  cache:
    description: >-
      Whether to cache ~/.cache/kai (the direct backend's store and the Roc
      compiler Kai downloads), keyed by the version, the runner's OS and
      architecture, cache-key and .kai/lock.json.
    default: "true"
  cache-key:
    description: >-
      Part of the cache's key, such as the job's name, for jobs that make
      different parts of the lock ready to keep separate cache entries
      rather than share and overwrite one.
    default: ""
  nix:
    description: >-
      Whether to install Nix, which every backend but the direct one needs.
      Set it to "false" for a project whose environments are all pinned
      downloads. Nix already on PATH is used as it is.
    default: "true"
  github-token:
    description: The token Nix uses for GitHub, against its rate limit.
    default: ${{ github.token }}

outputs:
  version:
    description: The Kai release installed.
    value: ${{ steps.check.outputs.version }}
  cache-hit:
    description: Whether the cache held exactly this key.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Check the inputs
      id: check
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CACHE: ${{ inputs.cache }}
        CACHE_KEY: ${{ inputs.cache-key }}
        NIX: ${{ inputs.nix }}
      run: |
        set -euo pipefail
        for input in "cache=$CACHE" "nix=$NIX"; do
          case ${input#*=} in
          true | false) ;;
          *) echo "setup-kai: ${input%%=*} must be true or false" >&2; exit 1 ;;
          esac
        done
        case $CACHE_KEY in
        *[!A-Za-z0-9._-]*) echo "setup-kai: cache-key may hold only letters, digits, '.', '_' and '-'" >&2; exit 1 ;;
        esac
        # The release Kaifile.roc's platform URL names, as in
        # pf: platform "https://github.com/thebrandonlucas/kai/releases/download/v0.0.12/<hash>.tar.zst",
        if [ -z "$VERSION" ]; then
          [ -f Kaifile.roc ] || { echo "setup-kai: no Kaifile.roc here to read the version from; set version, such as 0.0.12" >&2; exit 1; }
          platform=$(sed -n 's/^[[:space:]]*pf:[[:space:]]*platform[[:space:]]*"\([^"]*\)".*/\1/p' Kaifile.roc | head -n 1)
          case $platform in
          https://*/releases/download/v*/*) VERSION=${platform#*/releases/download/v}; VERSION=${VERSION%%/*} ;;
          "") echo "setup-kai: Kaifile.roc names no platform (pf:); set version, such as 0.0.12" >&2; exit 1 ;;
          *) echo "setup-kai: Kaifile.roc's platform is \"$platform\", not a Kai release's URL, so it names no version; set version, such as 0.0.12" >&2; exit 1 ;;
          esac
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "cache-key=setup-kai-$VERSION-$RUNNER_OS-$RUNNER_ARCH-${CACHE_KEY:+$CACHE_KEY-}" >> "$GITHUB_OUTPUT"
        if [ "$NIX" = true ] && ! command -v nix >/dev/null; then
          echo "install-nix=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Nix
      if: steps.check.outputs.install-nix == 'true'
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: Restore Kai's downloads
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/kai
        key: ${{ steps.check.outputs.cache-key }}${{ hashFiles('.kai/lock.json') }}
        restore-keys: ${{ steps.check.outputs.cache-key }}

    # No --yes: Nix, when wanted, is installed above, and without a terminal
    # install.sh only says how to install it.
    - name: Install Kai
      shell: bash
      env:
        VERSION: ${{ steps.check.outputs.version }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/setup-kai"
        sh "$GITHUB_ACTION_PATH/../../../install.sh" --version "$VERSION" --dir "$dir"
        echo "$dir" >> "$GITHUB_PATH"
