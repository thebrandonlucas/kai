name: CI

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Project CI
        run: nix develop --command zig build ci

      - name: Check Nix formatting
        run: nix fmt -- --check flake.nix

      - name: Check Nix package
        run: nix flake check

      - name: Build release outputs
        run: |
          nix build \
            .#platform-bundle \
            .#release-x86_64-linux \
            .#release-aarch64-linux \
            --no-link
