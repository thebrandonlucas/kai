name: CI

# Pull requests wait only on the required ci check: static checks and unit
# tests, in about two minutes. The end-to-end tests run beside it on ready
# pull requests, reporting without blocking. Everything slower (the full
# suite with release builds, aarch64-linux and real Guix) runs nightly and
# on demand, and release.yml runs its own copies before publishing.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Nightly at 07:00 UTC, every day, against master: runs the full suite,
  # aarch64-linux, macOS and real Guix, which pull requests skip.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces an older one for the same ref and draft state, so a
# push to a draft never cancels the run its "ready for review" started.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

# Every job restores the Nix store GitHub's cache holds for master. Only
# master runs save it, since a pull request's cache is visible to that pull
# request alone: pushes save the dev shell (nix-fast), the nightly suite also
# kai's own builds (nix-ci), each keyed by what the dev shell depends on.
# Garbage collection before saving trims the store to 6 GB, under the
# repository's 10 GB cache limit.
jobs:
  # Every branch push: static checks and unit tests.
  fast:
    name: fast
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kai
        uses: ./.github/actions/install-kai

      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-fast-${{ runner.arch }}-${{ hashFiles('Kaifile.roc', '.kai/lock.json', '.roc-version', '.roc-overlay') }}
          restore-prefixes-first-match: nix-fast-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/master' }}
          gc-max-store-size-linux: 6G

      - name: Check and run unit tests
        run: kai shell default -- zig build test

  # The required check: static checks and unit tests. A pull request that
  # changes only Markdown, docs/ or LICENSE needs no build; the job still
  # succeeds, so the check passes.
  ci:
    name: ci
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look for changes beyond docs
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_REF"
          if git diff --name-only FETCH_HEAD HEAD | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.changes.outputs.code == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kai
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/install-kai

      - name: Restore the Nix store
        if: steps.changes.outputs.code == 'true'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-fast-${{ runner.arch }}-${{ hashFiles('Kaifile.roc', '.kai/lock.json', '.roc-version', '.roc-overlay') }}
          restore-prefixes-first-match: nix-fast-${{ runner.arch }}-
          save: false

      - name: Check and run unit tests
        if: steps.changes.outputs.code == 'true'
        run: kai shell default -- zig build test

  # The end-to-end tests and configuration fixtures against real Nix, beside
  # the required check: they report on pull requests without blocking them.
  # This job builds kai once and uploads it, then checks the fixtures, which
  # need no kai; the e2e-suites jobs run the suites against that binary, and
  # the e2e job reports them all as one check.
  e2e-build:
    name: e2e (build kai)
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      code: ${{ steps.changes.outputs.code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look for changes beyond docs
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_REF"
          if git diff --name-only FETCH_HEAD HEAD | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.changes.outputs.code == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kai
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/install-kai

      - name: Restore the Nix store
        if: steps.changes.outputs.code == 'true'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-ci-${{ runner.arch }}-${{ hashFiles('Kaifile.roc', '.kai/lock.json', '.roc-version', '.roc-overlay') }}
          restore-prefixes-first-match: |
            nix-ci-${{ runner.arch }}-
            nix-fast-${{ runner.arch }}-
          save: false

      # The bare binary a release archive holds, as zig build e2e builds it.
      - name: Build kai
        if: steps.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          path="$(kai build kai-x64musl | tail -n 1)"
          mkdir dist
          install -m 755 "$path/kai" dist/kai

      # Uploaded before the fixtures, so the suites start without waiting.
      - name: Upload kai
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kai
          path: dist/kai
          if-no-files-found: error
          retention-days: 1

      # A step of its own, so the log shows what entering the shell costs.
      - name: Realise the dev shell
        if: steps.changes.outputs.code == 'true'
        run: kai shell default -- true

      - name: Check the configuration fixtures
        if: steps.changes.outputs.code == 'true'
        run: kai shell default -- zig build config-fixtures

  # The end-to-end suites in groups of about the same length, side by side,
  # each against the kai e2e-build uploaded. Every group runs to the end, so
  # one failure does not hide another.
  e2e-suites:
    name: e2e (${{ matrix.group }})
    needs: e2e-build
    if: needs.e2e-build.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: examples
            steps: e2e-examples
          - group: bundle, help, plugins
            steps: e2e-bundle e2e-help e2e-plugins
          - group: run, build
            steps: e2e-run e2e-build
          - group: workflow, update, overlays
            steps: e2e-workflow e2e-update e2e-overlays
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kai
        uses: ./.github/actions/install-kai

      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-ci-${{ runner.arch }}-${{ hashFiles('Kaifile.roc', '.kai/lock.json', '.roc-version', '.roc-overlay') }}
          restore-prefixes-first-match: |
            nix-ci-${{ runner.arch }}-
            nix-fast-${{ runner.arch }}-
          save: false

      - name: Download kai
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kai
          path: dist

      # A step of its own, so the log shows what entering the shell costs.
      - name: Realise the dev shell
        run: kai shell default -- true

      # -Dkai runs the suites with the downloaded kai, without building it
      # or rerunning the checks the ci job runs.
      - name: Run the end-to-end tests
        env:
          STEPS: ${{ matrix.steps }}
        run: |
          chmod +x dist/kai
          # shellcheck disable=SC2086 # STEPS lists several zig steps
          kai shell default -- zig build $STEPS -Dkai="$PWD/dist/kai" -- --nix

  # The e2e check: green when kai built, the fixtures held and every group
  # passed, or when a pull request changes only docs.
  e2e:
    name: e2e
    if: always() && github.event_name != 'push' && github.event_name != 'schedule' && github.event.pull_request.draft != true
    needs: [e2e-build, e2e-suites]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Every end-to-end job succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}" = true

  # Nightly and on demand: everything zig build ci runs, release builds
  # included.
  full:
    name: ci (full)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kai
        uses: ./.github/actions/install-kai

      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-ci-${{ runner.arch }}-${{ hashFiles('Kaifile.roc', '.kai/lock.json', '.roc-version', '.roc-overlay') }}
          restore-prefixes-first-match: |
            nix-ci-${{ runner.arch }}-
            nix-fast-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/master' }}
          gc-max-store-size-linux: 6G

      - name: Run Project CI
        run: kai shell default -- zig build ci

  # The same CI natively on aarch64-linux, nightly and on demand. Release
  # publishes the aarch64-linux archive only after release.yml's copy of this
  # job passes.
  ci-aarch64:
    name: ci (aarch64-linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kai
        uses: ./.github/actions/install-kai

      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-ci-${{ runner.arch }}-${{ hashFiles('Kaifile.roc', '.kai/lock.json', '.roc-version', '.roc-overlay') }}
          restore-prefixes-first-match: |
            nix-ci-${{ runner.arch }}-
            nix-fast-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/master' }}
          gc-max-store-size-linux: 6G

      - name: Run Project CI
        run: kai shell default -- zig build ci

  # Real Guix, with Nix hidden from kai, nightly and on demand: run it from
  # the Actions tab before merging a change to the Guix backend. A cold
  # channel checkout authenticates the whole history (about 35 minutes), so
  # it is cached; the first time-machine run at the pinned release downloads
  # that Guix.
  # Ubuntu's guix package brings a daemon and its substitute keys.
  guix:
    name: guix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Guix channel checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/guix
          key: guix-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: guix-cache-${{ runner.os }}-

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kai
        uses: ./.github/actions/install-kai

      - name: Install Guix
        run: |
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon
          for key in /usr/share/guix/*.pub; do
            sudo sh -c 'guix archive --authorize < "$1"' sh "$key"
          done
          guix --version

      - name: Run Guix integration
        run: kai shell default -- zig build guix-integration

  # Kai natively on Apple Silicon, nightly and on demand. No darwin release
  # exists yet, so it builds kai from source, then checks a small Kaifile:
  # update, run and shell work, and build refuses with the macOS message.
  macos:
    name: macos (aarch64-darwin)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kai
        run: |
          set -eu
          nix shell "$(cat .roc-overlay)#$(cat .roc-version)" nixpkgs#zig_0_16 --command sh -c \
            '(cd platform && zig build --release) && roc build cli/main.roc --output=kai'

      - name: Check a Kaifile
        run: |
          set -eu
          mkdir macos-check
          cd macos-check
          cat > Kaifile.roc <<'KAIFILE'
          app [kaifile] {
              pf: platform "../platform/main.roc",
              std: "../plugins/std/main.roc",
          }

          import std.Std

          kaifile = Std.kaifile([
              Name("macos-check"),
              Systems(["aarch64-darwin"]),
              Environment("cow", [Tools(["cowsay"])]),
              Shell("default", [Use("cow")]),
              Task("moo", [Use("cow"), Run(["cowsay", "moo"])]),
              Build("note", [Use("cow"), Run(["sh", "-c", "echo moo > note"]), Output("note"), Files([])]),
          ])
          KAIFILE
          ../kai check
          ../kai update
          ../kai run moo > run.log
          cat run.log
          grep -q moo run.log
          ../kai shell default -- cowsay hello > shell.log
          cat shell.log
          grep -q hello shell.log
          if ../kai build note > build.log 2>&1; then
            cat build.log
            echo "kai build should refuse on macOS"
            exit 1
          fi
          cat build.log
          grep -q macOS build.log
